<main>

    <h2>Starbucks</h2>

    <img src="../images/starbucks.jpg" alt="Starbucks">

    <p>
        Starbucks is a popular place for coffee, studying, and
        spending time with friends.
    </p>

    <h2>Suggest a Place</h2>

    <p>
        Know a great place around TUP that should be included
        in our guide? Let us know!
    </p>

    <form>

        <p>
            <label for="place-name">Place Name</label><br>
            <input type="text" id="place-name" name="place-name" required>
        </p>

        <fieldset>

            <legend>Category</legend>

            <p>
                <input type="radio" id="food" name="category" value="food">
                <label for="food">Food</label>
            </p>

            <p>
                <input type="radio" id="study" name="category" value="study">
                <label for="study">Study Spot</label>
            </p>

            <p>
                <input type="radio" id="outdoors" name="category" value="outdoors">
                <label for="outdoors">Outdoors</label>
            </p>

        </fieldset>

        <fieldset>

            <legend>What's good about it?</legend>

            <p>
                <input type="checkbox" id="affordable" name="good-points" value="affordable">
                <label for="affordable">Affordable</label>
            </p>

            <p>
                <input type="checkbox" id="wifi" name="good-points" value="wifi">
                <label for="wifi">Good Wi-Fi</label>
            </p>

            <p>
                <input type="checkbox" id="quiet" name="good-points" value="quiet">
                <label for="quiet">Quiet</label>
            </p>

        </fieldset>

        <p>
            <label for="email">Contact Email</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <button type="submit">Suggest place</button>
        </p>

    </form>

</main>
